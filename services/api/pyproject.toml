[project]
name = "retent-api"
version = "0.1.0"
description = "Retent AI API: analysis jobs, SSE progress, simulation, exports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "retent-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
retent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retent_api"]
