[project]
name = "retent-ml"
version = "0.1.0"
description = "Retent AI offline pipeline: data collection, labeling, training, evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "retent-core",
    "yt-dlp[default,curl-cffi]>=2025.9",
    "requests>=2.32",
]

[tool.uv.sources]
retent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retent_ml"]
