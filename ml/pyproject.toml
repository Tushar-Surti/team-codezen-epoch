[project]
name = "retent-ml"
version = "0.1.0"
description = "Retent AI offline pipeline: data collection, labeling, training, evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "retent-core",
    "yt-dlp[default,curl-cffi]>=2025.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "huggingface-hub>=0.26",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
# GPU machines only (Windows/Linux + NVIDIA): local Whisper and embeddings.
#   uv sync --all-packages --all-extras
gpu = [
    "torch>=2.7",
    "faster-whisper>=1.1",
    "tokenizers>=0.21",  # older versions have no Windows wheels for Python 3.12
]

[tool.uv.sources]
retent-core = { workspace = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retent_ml"]
