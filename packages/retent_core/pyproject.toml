[project]
name = "retent-core"
version = "0.1.0"
description = "Retent AI shared core: analysis contract, text features, retention engine, flags, simulator."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "httpx>=0.28",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retent_core"]
